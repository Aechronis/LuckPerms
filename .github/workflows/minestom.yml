name: Minestom Maven Central

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified release to Maven Central
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: minestom-central-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check version selection
        run: python3 -m unittest discover -s minestom -p 'test_next_version.py'
      - name: Select next Minestom version
        id: version
        run: |
          version=$(python3 minestom/next-version.py)
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Selected Minestom version: $version"
      - name: Build, test, and prepare local Maven publication
        run: >-
          ./gradlew -PminestomOnly -PunsignedLocalPublication=true
          "-PminestomVersion=$RELEASE_VERSION"
          :common:test :minestom:build
          :minestom:publishAllPublicationsToLocalBuildRepository
      - name: Verify publication contents and metadata
        run: python3 minestom/verify-publication.py minestom/build/repository "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: luckperms-minestom-${{ env.RELEASE_VERSION }}
          path: minestom/build/repository/
          if-no-files-found: error

  publish:
    if: >-
      github.repository == 'Aechronis/LuckPerms' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reserve version and publish to Maven Central
        env:
          GH_TOKEN: ${{ github.token }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          for variable in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [ -z "${!variable}" ]; then
              echo "Missing required secret for $variable" >&2
              exit 1
            fi
          done
          # Reserve before upload: failed attempts keep their tag, so retries advance.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_VERSION" -f "sha=$GITHUB_SHA" --silent
          ./gradlew -PminestomOnly "-PminestomVersion=$RELEASE_VERSION" \
            :minestom:publishAndReleaseToMavenCentral
