name: Minestom

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew -PminestomOnly :common:test :minestom:build
      - uses: actions/upload-artifact@v4
        with:
          name: luckperms-minestom
          path: minestom/build/libs/luckperms-minestom-*.jar
          if-no-files-found: error
